# Build a portable (unpackaged, self-contained) Windows x64 version of Files
# in the cloud, and upload it as a downloadable artifact.
#
# WHY THIS EXISTS
#   Files is a WinUI 3 / Windows App SDK app. Its toolchain (Visual Studio 2022,
#   Windows 11 SDK 10.0.26100.0, .NET 10 SDK, Windows App SDK 2.0.1, MSVC + C++ ATL)
#   is Windows-only, so the binary cannot be compiled on Linux/macOS. This workflow
#   uses GitHub's Windows runner to produce the artifact for you.
#
# HOW TO USE (no Windows PC needed)
#   1. Fork https://github.com/files-community/Files
#   2. Add this file to your fork at: .github/workflows/build-portable-x64.yml
#   3. Go to Actions -> "Build Files Portable x64" -> Run workflow
#   4. When it finishes, download the "Files-Portable-x64" artifact (a zip).
#   5. Extract on any Windows x64 machine and run Files.App.exe (no install needed).
#
# The artifact is UNPACKAGED + SELF-CONTAINED:
#   WindowsPackageType=None  -> no MSIX registration, no admin rights
#   SelfContained=true       -> .NET 10 + Windows App SDK runtime bundled in
#   RuntimeIdentifier=win-x64-> native x64

name: Build Files Portable x64

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag/branch to build (e.g. v4.2.9)"
        required: true
        default: "v4.2.9"
        type: string
  push:
    branches: ["main"]
    paths: [".github/workflows/build-portable-x64.yml"]

permissions:
  contents: read

jobs:
  build:
    # Windows runner with Visual Studio + Windows SDK + .NET.
    # Use the latest Windows image that has VS2022 + WinUI workload.
    runs-on: windows-latest
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v6
        with:
          repository: files-community/Files
          ref: ${{ github.event.inputs.version || 'v4.2.9' }}
          fetch-depth: 1

      - name: Setup .NET (uses repo global.json -> .NET 10)
        uses: actions/setup-dotnet@v5

      - name: Setup MSBuild & VS components
        uses: microsoft/setup-msbuild@v3

      # WinUI 3 XAML compiler + Windows App SDK targets come from NuGet, but the
      # Windows 11 SDK (10.0.26100.0) and the WinUI/C++ ATL workloads must be
      # present. Install any missing VS components idempotently.
      - name: Ensure required VS workloads (WinUI, C++ ATL, Windows SDK)
        shell: pwsh
        run: |
          $vsDir = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $vsInstaller = "$vsDir\..\..\Common7\Tools\..\..\..\Installer\setup.exe"
          $components = @(
            "Microsoft.VisualStudio.Workload.Universal",
            "Microsoft.VisualStudio.Component.WinUI",
            "Microsoft.VisualStudio.Component.Windows11SDK.26100",
            "Microsoft.VisualStudio.Component.VC.ATL",
            "Microsoft.VisualStudio.Component.MSVC.BuildTools",
            "Microsoft.VisualStudio.ComponentGroup.WindowsAppSDK.Cs"
          )
          $add = ($components | ForEach-Object { "--add $_" }) -join " "
          # Try to modify; ignore non-zero if already present.
          Start-Process -FilePath "$vsDir\..\..\Installer\setup.exe" -ArgumentList @("--quiet","--norestart",$add) -Wait -NoNewWindow
          Write-Host "VS component check done."

      - name: Restore
        shell: pwsh
        run: |
          msbuild Files.slnx -t:Restore -p:Platform=x64 -p:Configuration=Release -p:PublishReadyToRun=true -v:quiet -clp:ErrorsOnly

      - name: Publish portable x64 (unpackaged, self-contained)
        shell: pwsh
        run: |
          msbuild src\Files.App\Files.App.csproj `
            -t:Publish `
            -p:Platform=x64 `
            -p:Configuration=Release `
            -p:RuntimeIdentifier=win-x64 `
            -p:WindowsPackageType=None `
            -p:SelfContained=true `
            -p:PublishReadyToRun=true `
            -p:PublishTrimmed=false `
            -v:quiet -clp:ErrorsOnly

      - name: Verify publish output
        shell: pwsh
        run: |
          $pub = Get-ChildItem -Path "src\Files.App\bin" -Recurse -Directory -Filter publish |
                  Where-Object { $_.FullName -like "*win-x64*" } | Select-Object -First 1
          if (-not $pub) { throw "Publish output not found" }
          Write-Host "Publish dir: $($pub.FullName)"
          Get-ChildItem $pub.FullName | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload portable x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: Files-Portable-x64
          path: src/Files.App/bin/Release/*/win-x64/publish/**
          if-no-files-found: error
          retention-days: 30
